[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shunyaekam/living-lamp"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the simulator's experiments run millions of steps; keep `cargo test` quick without a release build
[profile.dev.package.lamp-model]
opt-level = 3
